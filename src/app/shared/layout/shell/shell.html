<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside class="w-64 bg-sidebar flex-none flex flex-col">
    <div class="h-16 flex items-center px-6 border-b border-white/10">
      <span class="text-white text-lg font-semibold">VicFix</span>
    </div>
    <nav class="flex-1 px-3 py-4 overflow-y-auto space-y-1">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="text-accent bg-white/10 font-medium"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition-colors text-sm"
        >
          {{ link.label }}
        </a>
      }
    </nav>
  </aside>

  <!-- Content area -->
  <div class="flex flex-col flex-1 min-w-0 overflow-hidden">
    <!-- Header -->
    <header class="h-16 bg-surface border-b border-slate-200 flex-none flex items-center justify-between px-6">
      <span class="text-text-primary font-semibold text-sm">VicFix</span>
      <div class="flex items-center gap-3">
        <span class="text-text-secondary text-sm">Usuario</span>
        <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center">
          <span class="text-text-secondary text-xs font-medium">U</span>
        </div>
      </div>
    </header>

    <!-- Route content -->
    <main class="flex-1 overflow-auto bg-app-bg p-6">
      <router-outlet />
    </main>
  </div>
</div>
