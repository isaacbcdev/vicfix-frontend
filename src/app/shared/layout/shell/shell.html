<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside class="w-64 bg-sidebar flex-none flex flex-col">
    <div class="h-16 flex items-center px-6 border-b border-white/10">
      <span class="text-white text-lg font-semibold">VicFix</span>
    </div>
    <nav class="flex-1 px-3 py-4 overflow-y-auto space-y-1">
      @for (link of navLinks; track link.path) {
      <a [routerLink]="link.path" routerLinkActive="text-accent bg-white/10 font-medium"
        [routerLinkActiveOptions]="{ exact: link.exact ?? false }"
        class="flex items-center px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition-colors text-sm">
        {{ link.label }}
      </a>
      }
    </nav>
  </aside>

  <!-- Content area -->
  <div class="flex flex-col flex-1 min-w-0 overflow-hidden">
    <!-- Header -->
    <header class="h-16 bg-surface border-b border-slate-200 flex-none flex items-center justify-between px-6">
      <span class="text-text-primary font-semibold text-sm">VicFix</span>
      <div class="flex items-center gap-3">
        <span class="text-sm text-text-secondary">{{ authService.user()?.username }}</span>
        <button (click)="logout()" [disabled]="loggingOut()"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm text-text-secondary hover:text-[#DC2626] hover:bg-red-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
          @if (loggingOut()) {
          <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z" />
          </svg>
          } @else {
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
          </svg>
          }
          Cerrar sesión
        </button>
      </div>
    </header>

    <!-- Route content -->
    <main class="flex-1 overflow-auto bg-app-bg p-6">
      <router-outlet />
    </main>
  </div>
</div>
