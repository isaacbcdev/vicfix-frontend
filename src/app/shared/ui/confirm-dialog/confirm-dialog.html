@if (svc.visible()) {
<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
  <div class="bg-white rounded-xl shadow-xl max-w-md w-full mx-4"
       role="dialog"
       aria-modal="true"
       [attr.aria-labelledby]="'confirm-title'"
       (keydown.escape)="svc.respond(false)">

    <!-- Header -->
    <div class="px-5 py-4 border-b border-slate-100">
      <h2 id="confirm-title" class="text-base font-semibold text-text-primary">{{ svc.title() }}</h2>
    </div>

    <!-- Body -->
    <div class="px-5 py-4">
      <p class="text-sm text-text-secondary">{{ svc.message() }}</p>
    </div>

    <!-- Footer -->
    <div class="px-5 py-4 border-t border-slate-100 flex justify-end gap-3">
      <button
        type="button"
        (click)="svc.respond(false)"
        class="px-4 py-2 text-sm font-medium text-text-secondary bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors">
        {{ svc.cancelLabel() }}
      </button>
      <button
        type="button"
        (click)="svc.respond(true)"
        [class]="confirmBtnClass()">
        {{ svc.confirmLabel() }}
      </button>
    </div>

  </div>
</div>
}
