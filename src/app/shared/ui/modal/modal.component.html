@if (isOpen()) {
<div class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center" (click)="close()">
  <div class="bg-white rounded-xl shadow-xl z-50 max-w-lg w-full mx-4" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
      <h2 class="text-base font-semibold text-text-primary">{{ title() }}</h2>
      <button (click)="close()"
        class="p-1.5 rounded-lg text-text-secondary hover:text-accent hover:bg-emerald-50 transition-colors"
        aria-label="Cerrar">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Body -->
    <ng-content />
  </div>
</div>
}
